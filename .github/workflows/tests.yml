name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Regenerate reference vectors from upstream C++ (must be unchanged)
        run: |
          python tests/reference/generate_vectors.py
          git diff --exit-code tests/vectors
      - run: pytest -q
